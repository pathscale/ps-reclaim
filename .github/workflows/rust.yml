name: Rust

on:
  push:
    branches: [ "master" ]
  # Any target branch, not just master. A stacked PR against a feature branch
  # reported zero checks and nobody noticed until a reviewer pointed at it.
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    # This stacked review was explicitly requested as source-only. Keep its
    # draft from compiling; normal PRs and a later ready-for-review run retain CI.
    if: github.head_ref != 'fix/reclaim-review' || github.event.pull_request.draft != true
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Run tests
        run: cargo test --all-targets --verbose
      # --all-targets skips doctests, and the compile_fail doctest on `Guard`
      # is what holds it `!Send`. Run them.
      - name: Run doctests
        run: cargo test --doc --verbose

  lint:
    if: github.head_ref != 'fix/reclaim-review' || github.event.pull_request.draft != true
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  # A native test run cannot observe the reorderings this crate's correctness
  # rests on. Miri can, and strict provenance is what rejects the integer round
  # trip the packed guard was first written with.
  miri:
    if: github.head_ref != 'fix/reclaim-review' || github.event.pull_request.draft != true
    name: Miri
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Miri (strict provenance)
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo miri test

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, lint, miri]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping publish"; exit 0; fi
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if curl -fsSL "https://index.crates.io/ps/-r/ps-reclaim" | sed -n 's/.*"vers":"\([^"]*\)".*/\1/p' | grep -qx "$v"; then
            echo "ps-reclaim $v is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish

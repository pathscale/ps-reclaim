name: Rust

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

# What runs here is deliberately small: build, test and lint. Anything
# expensive - Miri, the feature matrix, the benchmarks - lives in `manual.yml`
# behind `workflow_dispatch`, because it belongs to whoever is investigating
# something, not to every push.
jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      # Not `--all-targets`: that pulls in the bench targets, and a benchmark
      # has no business running on a shared runner. `cargo test` on its own
      # covers lib, integration tests and doctests, and skips benches.
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      # The bare `no_std` build, with no feature named. 0.1.4 failed here: its
      # `spin` and `libc` were optional, so `default-features = false` alone
      # did not compile, and nothing on push tried it.
      - name: Build without std
        run: cargo check --lib --no-default-features

  lint:
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --lib --bins --tests -- -D warnings

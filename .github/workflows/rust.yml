name: Rust

on:
  push:
    branches: [ "master" ]
  # Any target branch, not just master. A stacked PR against a feature branch
  # reported zero checks and nobody noticed until a reviewer pointed at it.
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Run tests
        run: cargo test --all-targets --verbose
      # --all-targets skips doctests, and the compile_fail doctest on `Guard`
      # is what holds it `!Send`. Run them.
      - name: Run doctests
        run: cargo test --doc --verbose

  # Everything above runs one configuration: default features, on Linux. That
  # left four production configurations with no CI at all, which a review caught
  # rather than a build failure. These are the ones consumers actually select.
  #
  # `inline-tsd` is here on purpose even though its fast path is aarch64 macOS
  # only: on any other target it must fall back to the libc call and keep
  # building, and this is what proves it.
  features:
    name: Feature matrix
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no_std, platform keys
            args: --no-default-features --features libc,spin
          - name: no_std, spin garbage
            args: --no-default-features --features libc,spin,spin-garbage
          - name: std, spin garbage
            args: --features spin-garbage
          - name: no_std, inline-tsd fallback
            args: --no-default-features --features libc,spin,inline-tsd
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build (${{ matrix.name }})
        run: cargo build --all-targets --verbose ${{ matrix.args }}
      - name: Test (${{ matrix.name }})
        run: cargo test --all-targets --verbose ${{ matrix.args }}
      - name: Clippy (${{ matrix.name }})
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

  # Everything else here runs on x86_64, which is TSO: it reorders far less than
  # this crate's correctness assumes it might. The deployment target is aarch64
  # (Graviton), which is weakly ordered, so the platform where the pin/scan
  # fence pairing actually has to work was the one platform never tested.
  #
  # Miri models the C++ memory model rather than a chip, so it is not a
  # substitute for running on the hardware, and the reader-safety stress test
  # publishes through a `Mutex` that supplies its own ordering. Between them
  # that left the fences unexercised. This job is the cheapest correction.
  aarch64:
    name: aarch64 (deployment arch)
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: no_std, platform keys
            args: --no-default-features --features libc,spin
          - name: no_std, spin garbage
            args: --no-default-features --features libc,spin,spin-garbage
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Build (${{ matrix.name }})
        run: cargo build --all-targets --verbose ${{ matrix.args }}
      # Repeated, because a weak-memory failure is a race and one green run is
      # weak evidence. Cheap here: the whole suite is well under a minute.
      - name: Test x5 (${{ matrix.name }})
        run: |
          for i in 1 2 3 4 5; do
            echo "--- run $i"
            cargo test --all-targets ${{ matrix.args }}
          done

  lint:
    name: Format and clippy
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  # A native test run cannot observe the reorderings this crate's correctness
  # rests on. Miri can, and strict provenance is what rejects the integer round
  # trip the packed guard was first written with.
  miri:
    name: Miri
    runs-on: ubicloud-standard-2
    # Two passes now, and `concurrency` alone took 597s in the last run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          add-job-id-key: "false"
      # Two passes, because one test has to leak and the rest must not.
      #
      # `tests/tls_teardown.rs` needs a `&'static Domain` that outlives
      # thread-local destructors, which only `Box::leak` gives it. That is a
      # fixture leak, not a crate leak, and Miri's exit-time check cannot tell
      # the difference. Turning leak checking off globally to accommodate it
      # would throw away the signal that matters most here: this crate hands out
      # registry slots and a leaked one is a real defect.
      #
      # So the suite keeps strict leak checking with that test excluded, and the
      # test runs on its own with leaks ignored. Undefined behaviour is still
      # checked in both, which is the part worth having on a teardown path.
      - name: Miri (strict provenance, leak-checked)
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          cargo miri test --lib \
            --test concurrency \
            --test contract \
            --test handle_overflow \
            --test handles \
            --test overflow_slots
      - name: Miri (teardown fixture, leaks ignored)
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-ignore-leaks
        run: cargo miri test --test tls_teardown

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, lint, miri]
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "CARGO_REGISTRY_TOKEN not set; skipping publish"; exit 0; fi
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if curl -fsSL "https://index.crates.io/ps/-r/ps-reclaim" | sed -n 's/.*"vers":"\([^"]*\)".*/\1/p' | grep -qx "$v"; then
            echo "ps-reclaim $v is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish

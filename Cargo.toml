[package]
name = "ps-reclaim"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Per-domain grace-period reclamation for lock-free readers"
repository = "https://github.com/pathscale/ps-reclaim"

[dependencies]

# `spin` rather than a hand-rolled lock: a spin mutex and a once-cell are the
# kind of small unsafe primitive that looks obvious and is not, and this crate
# exists to make reclamation safe. Default features off, so it brings nothing.
spin = { version = "0.9", default-features = false, features = [
    "mutex",
    "spin_mutex",
    "once",
], optional = true }

[target.'cfg(unix)'.dependencies]
# Only the `no_std` build needs it, for the `pthread_key_t` that stands in for
# `thread_local!`. The default build has no dependencies at all, as before.
libc = { version = "0.2", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
], optional = true }

[features]
default = ["std"]

# Off, this crate does not link `std`. It still needs the platform underneath:
# `thread_local!` becomes a `pthread_key_t` on unix and an `FlsAlloc` slot on
# Windows, so turning `std` off means turning the platform crate on:
#
#     ps-reclaim = { version = "0.1", default-features = false, features = ["libc"] }
#
# `Mutex` and `OnceLock` become spins over `core` atomics. Neither is on the
# steady-state read path; writer tail latency still needs measurement.
std = []

# Native Unix TLS for the cache; its separately owned lease closes the cache
# before recycling. Windows keeps both cache and lease in FLS, including with
# this feature: a thread-local cache cannot safely borrow a per-fiber lease.
nightly = []

# Read the thread-local slot with inline asm instead of calling
# `pthread_getspecific`. Same key, same slot, same destructor: only the read is
# inlined, which is what lets the optimiser move it. Off by default because the
# TSD layout it depends on is an undocumented ABI. aarch64 macOS only; every
# other target keeps the call.
inline-tsd = []

# Experimental isolation control: with std, change only the garbage-list
# mutex, leaving TLS and the registry allocator unchanged. Not a speed claim.
spin-garbage = ["spin"]

[dev-dependencies]
# Only to measure against what this replaces. Not a runtime dependency.
crossbeam-epoch = "0.9"
seize = "0.5"
criterion = "0.5"
# `getrusage` in `benches/burst.rs`: wall clock cannot see a burnt core.
libc = "0.2"

[[bench]]
name = "pin"
harness = false

[[bench]]
name = "burst"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ps_loom)'] }
